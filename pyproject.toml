[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-ai"
version = "0.6.3"
description = "Orbit: local model training, chat, and an OpenAI-compatible API in one browser interface."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.2", "numpy>=1.24", "psutil>=5.9", "setproctitle>=1.3"]

[project.scripts]
orbit = "orbit.cli:main"
orbit-server = "orbit.web:main"
orbit-train = "orbit.train:main"
orbit-gui = "orbit.gui:main"

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.setuptools.package-data]
orbit = ["static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
