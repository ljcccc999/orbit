[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-oca"
version = "0.1.0"
description = "Orbit Continuum Architecture research prototype"
requires-python = ">=3.10"
dependencies = ["mlx>=0.25.0"]

[tool.setuptools.packages.find]
include = ["orbit*"]

