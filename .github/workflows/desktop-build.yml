name: Desktop builds
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x desktop/macos/build.sh && desktop/macos/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS-universal
          path: dist/Orbit-macOS-universal.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Orbit-macOS-universal.zip
  windows:
    runs-on: windows-2025
    strategy: {matrix: {runtime: [win-x64, win-arm64]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish desktop/windows/OrbitDesktop.csproj -c Release -r ${{ matrix.runtime }} -o dist/${{ matrix.runtime }}
      - shell: pwsh
        run: |
          $suffix = if ("${{ matrix.runtime }}" -eq "win-x64") { "x64" } else { "arm64" }
          Move-Item "dist/${{ matrix.runtime }}/Orbit.exe" "dist/Orbit-Windows-$suffix.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-${{ matrix.runtime }}
          path: dist/Orbit-Windows-*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Orbit-Windows-*.exe
  linux:
    runs-on: ubuntu-24.04
    strategy: {matrix: {arch: [x64, arm64]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/linux/package-lock.json
      - run: npm ci
        working-directory: desktop/linux
      - run: npm run dist -- --${{ matrix.arch }}
        working-directory: desktop/linux
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Linux-${{ matrix.arch }}
          path: desktop/linux/dist/Orbit-Linux-*.AppImage
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/linux/dist/Orbit-Linux-*.AppImage
